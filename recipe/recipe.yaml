schema_version: 1

context:
  version: "0.0.7"

package:
  name: sigstore-models
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sigstore-models/sigstore_models-${{ version }}.tar.gz
  sha256: 9f3b909d0c9ab388f839b3a7dbfaab79c66aa8b479a2d95838a2bdad88c49651

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.0,<0.10
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=2.12
    - typing-extensions >=4.14.1

tests:
  - python:
      imports:
        - sigstore_models
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Pydantic based models for Sigstore's protobuf specifications
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/sigstore-models/

extra:
  recipe-maintainers:
    - travishathaway
    - jezdez
